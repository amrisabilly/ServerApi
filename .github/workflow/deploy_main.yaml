# .github/workflows/deploy.yml
name: Auto Deploy on Push via SSH (main)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Pull latest code di server via SSH
      - name: Pull latest code on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/${{ secrets.SSH_USERNAME }}/monitoringweb.decoratics.id
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan config:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      # 2️⃣ Checkout repository di GitHub runner untuk build frontend
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            app/
            config/
            database/
            routes/
            resources/
            package.json
            package-lock.json
            vite.config.js
            tailwind.config.js
            postcss.config.js
            public/index.php
            public/.htaccess
            public/web.config
            .env.example
            composer.json
            artisan
          sparse-checkout-cone-mode: false

      # 3️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 4️⃣ Cache Node modules
      - name: Cache Node.js modules
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 5️⃣ Install dependencies & build Tailwind/Vite
      - name: Install Node dependencies
        run: npm ci

      - name: Build Tailwind / Vite
        run: npm run build

      # 6️⃣ Upload build assets ke server
      - name: Upload built assets to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/"
          target: "/home/${{ secrets.SSH_USERNAME }}/monitoringweb.decoratics.id/"
